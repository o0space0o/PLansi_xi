name: Validate PLansi_xi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned development dependencies
        run: npm ci
      - name: Check syntax and actual graphics assets
        run: npm run check
      - name: Test animation, music, lighting, and portable runtimes
        run: npm test
      - name: Check readable source formatting
        run: npm run format:check
      - name: Verify the public copy has no songs and starts independently
        run: node scripts/smoke-project.mjs . 4180 --no-audio
